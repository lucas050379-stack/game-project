# 미니게임 모음을 웹으로 내보내 GitHub Pages 에 올린다.
# minigames 폴더가 바뀌어 main 에 푸시되면 돌고, Actions 화면에서 손으로도 돌릴 수 있다. 작업은 minigames 브랜치에서 한다.
name: minigames-web

on:
  push:
    branches: [main]   # 배포는 main 에서만 — 작업 브랜치(minigames)에 푸시해도 안 돈다
    paths:
      - "minigames/**"
      - ".github/workflows/minigames-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 푸시하면 앞선 배포를 취소하고 마지막 것만 올린다
concurrency:
  group: minigames-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 템플릿 묶음이 1.2GB 라 웹용 파일만 추려 캐시한다
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz \
            templates/web_nothreads_release.zip \
            templates/web_nothreads_debug.zip \
            templates/version.txt \
            -d "$dest"

      # 순위 서버 주소는 저장소에 안 올린다. RANK_URL 시크릿이 없으면 순위 없이 돈다
      - name: Write rank url
        env:
          RANK_URL: ${{ secrets.RANK_URL }}
        run: |
          if [ -n "$RANK_URL" ]; then printf '%s' "$RANK_URL" > minigames/rank_url.txt; fi

      - name: Export Web
        working-directory: minigames
        run: |
          mkdir -p dist/web
          touch dist/.gdignore
          ~/godot/godot --headless --path . --import
          ~/godot/godot --headless --path . --export-release Web "$PWD/dist/web/index.html"
          # 내보내기가 실패해도 종료 코드가 0 일 수 있어 결과물로 판정한다
          test -s dist/web/index.pck
          test -s dist/web/index.wasm
          ls -la dist/web

      - uses: actions/upload-pages-artifact@v5
        with:
          path: minigames/dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
